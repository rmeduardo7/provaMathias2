<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Prova</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="dias">
    <div class="dia ativo">SEG<br>29</div>
    <div class="dia">TER<br>30</div>
  </div>

  <div class="slot">
    <div class="hora">09:00</div>
    <div class="card">
      <div class="topo">
        <span class="local"><i class="fa-solid fa-map"></i> Arena x</span>
        <span><i class="fa-solid fa-clock"></i> 09:00 - 1h</span>
      </div>
      <h2>React Today and Tomorrow</h2>
      <div class="pessoas">
        <div class="pessoa"><img src="https://pbs.twimg.com/profile_images/1806728562445299712/7BAevDsO_400x400.jpg"><div><b>Sophie Alpert</b><br>Facebook</div></div>
        <div class="pessoa"><img src="https://pbs.twimg.com/profile_images/1948633300601634817/ENSCk-u5_400x400.jpg"><div><b>Dan Abramov</b><br>Bluesky</div></div>
      </div>
    </div>
  </div>
  
  <div class="slot">
    <div class="hora">10:00</div>
    <div class="card">
      <div class="topo">
        <span class="local"><i class="fa-solid fa-map"></i> Sala 14</span>
        <span><i class="fa-solid fa-clock"></i> 10:00 - 1h</span>
      </div>
      <h2>Building resilient frontend architecture</h2>
      <div class="pessoa"><img src="https://pbs.twimg.com/profile_images/1482747386665607172/8iALYMAt_400x400.jpg"><div><b>Monica Lent</b><br>SumUp</div></div>
    </div>
  </div>
</body>
</html>
